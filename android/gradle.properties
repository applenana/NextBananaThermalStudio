org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP / NDK 兼容: flutter_libserialport 0.4.0 等老插件未声明 minSdk, NDK 27
# 默认 platform 16 触发 [CXX1110]. 强制对齐到 21.
android.ndk.suppressMinSdkVersionError=21
# 插件源码在 C: 的 Pub 缓存、工程在 D: 时，Kotlin 增量缓存无法计算相对路径。
# 关闭增量缓存可避免守护进程报错后再回退重编，Release 构建更稳定。
kotlin.incremental=false
